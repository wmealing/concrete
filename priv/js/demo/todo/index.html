<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Concrete -- todo list</title>
  <link rel="stylesheet" href="/theme.css">
  <style>
    #todo-form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    #new-todo { flex: 1; }
    #todo-list { list-style: none; padding: 0; margin: 0 0 1rem 0; }
    .todo-item { display: flex; align-items: center; gap: 0.5rem;
                 padding: 0.3rem 0; border-bottom: 1px solid var(--border); }
    .todo-item.done span { text-decoration: line-through; color: var(--text-mute); }
    .todo-item span { flex: 1; }
    .todo-item button { color: var(--danger); }
    .empty { color: var(--text-mute); font-style: italic; padding: 0.5rem 0; }
    #todo-footer { display: flex; justify-content: space-between;
                   align-items: center; font-size: 0.9rem; color: var(--text-dim); }
  </style>
</head>
<body>
  <a class="back-link" href="http://localhost:8760/">&larr; All demos</a>

  <div id="todo-root" class="panel">
    <div id="todo-form">
      <input id="new-todo" type="text" placeholder="What needs doing?">
      <button data-action="add">Add</button>
    </div>
    <ul id="todo-list"></ul>
    <div id="todo-footer">
      <span id="todo-count">0 item(s) left</span>
      <button data-action="clear">Clear completed</button>
    </div>
  </div>

  <script src="/runtime.js"></script>
  <script src="/todo/todo.js"></script>
  <script src="/todo/todo_boot.js"></script>
  <script src="http://localhost:8799/dev-reload.js"></script>
</body>
</html>
