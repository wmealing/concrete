<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Concrete -- todo list</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; color: #222; }
    #todo-root { max-width: 28rem; border: 2px solid #444; border-radius: 8px;
                 padding: 1rem 1.5rem; }
    #todo-form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    #new-todo { flex: 1; font-size: 1rem; padding: 0.4rem; }
    #todo-list { list-style: none; padding: 0; margin: 0 0 1rem 0; }
    .todo-item { display: flex; align-items: center; gap: 0.5rem;
                 padding: 0.3rem 0; border-bottom: 1px solid #eee; }
    .todo-item.done span { text-decoration: line-through; color: #999; }
    .todo-item span { flex: 1; }
    .todo-item button { color: #a00; }
    .empty { color: #999; font-style: italic; padding: 0.5rem 0; }
    #todo-footer { display: flex; justify-content: space-between;
                   align-items: center; font-size: 0.9rem; color: #666; }
  </style>
</head>
<body>

  <p><a href="http://localhost:8760/">&larr; All demos</a></p>
  <div id="todo-root">
    <div id="todo-form">
      <input id="new-todo" type="text" placeholder="What needs doing?">
      <button data-action="add">Add</button>
    </div>
    <ul id="todo-list"></ul>
    <div id="todo-footer">
      <span id="todo-count">0 item(s) left</span>
      <button data-action="clear">Clear completed</button>
    </div>
  </div>

  <script src="/runtime.js"></script>
  <script src="/todo/todo.js"></script>
  <script src="/todo/todo_boot.js"></script>
</body>
</html>
